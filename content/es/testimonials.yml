entries:
  - quote: La visión de Víctor para el cine es impresionante. Su creatividad y su capacidad de contar historias a través del video superan todas las expectativas. El trabajo que hizo para nuestro programa capturó la atención y las emociones de la audiencia de una forma única. Es sin duda un referente en la producción audiovisual.
    name: Derwin Eusebio
    role: Coordinador Audiovisual, PLERD
    mode: both
  - quote: Víctor tiene un ojo extraordinario para la fotografía. Cada imagen transmite emociones y logra narrar historias visuales impactantes. Su enfoque profesional aseguró que nuestros eventos educativos quedaran registrados con calidad y belleza. Es un placer colaborar en proyectos con él.
    name: Elcilia Del Carme Torres G.
    role: Gestora Educativa y Formadora
    mode: both
  - quote: El desarrollo web de Víctor nos permitió mejorar la presencia digital de nuestro equipo. Sus soluciones son funcionales, modernas y centradas en el usuario. El sitio que diseñó es rápido y fácil de usar, lo que ha facilitado la comunicación y la gestión de proyectos.
    name: Victor J. Garces
    role: Ingeniero de Software
    mode: dev
