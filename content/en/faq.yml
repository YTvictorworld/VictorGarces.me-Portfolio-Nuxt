entries:
  - q: What services do you offer?
    a: "I offer full-stack web development. On the front end: UX/UI design, interactive prototyping, and responsive websites and web applications built with Vue.js/Nuxt.js. On the back end: REST APIs and microservices with C#/.NET, database design, containerization with Docker, and cloud deployments on AWS. My goal is to create seamless digital experiences from concept to deployment."
    mode: dev
    category: Services & Process
    order: 1
    featured: true
    draft: false
  - q: What technologies do you work with?
    a: "**Front-end:** Vue.js, Nuxt, TypeScript and Tailwind CSS. **Back-end:** C#/.NET, SQL databases, microservices architecture, Docker and AWS. I've been building back-end systems professionally for almost a year. **Beyond code:** photography, filmmaking and video editing with Adobe Premiere Pro."
    mode: dev
    category: Services & Process
    order: 2
    featured: false
    draft: false
  - q: How do you work?
    a: "Projects are developed in **phases**: functional deliverables completed sequentially. At the end of each week I present the progress in a short meeting, so you always know where the project stands and can give feedback early. A new phase begins once the previous one is delivered, paid and approved."
    mode: dev
    category: Services & Process
    order: 3
    featured: true
    draft: false
  - q: What will you need from me?
    a: To keep the project moving I'll need the **content** (copy, images, audio, video), your **design references** (colors, style, logo), a **payment method** to cover the monthly cost of the operation services (hosting, domain and similar), and your feedback in the weekly check-ins. Delays in providing these shift the delivery dates accordingly.
    mode: dev
    category: Services & Process
    order: 4
    featured: false
    draft: false
  - q: How is a project priced and billed?
    a: "Payment is **per phase**: each phase is paid in full at its start, and work on a phase begins once its payment is received. All amounts are in USD. Quotes and timelines correspond to the agreed scope. New features or major changes in requirements are quoted and agreed separately, before any work on them starts."
    mode: dev
    category: Pricing & Timelines
    order: 5
    featured: true
    draft: false
  - q: How long does a project take?
    a: Projects are planned in **weeks**, with an agreed number of dedicated hours per week. Timelines are good-faith estimates and depend on receiving the content, access and approvals on time; delays on those shift the dates accordingly. I reply to questions and requests within up to three business days; a priority support plan is available if you need faster response times.
    mode: dev
    category: Pricing & Timelines
    order: 6
    featured: true
    draft: false
  - q: How many revisions are included?
    a: Each phase includes up to **two rounds of adjustments** on what was agreed for that phase. A phase is considered approved when you confirm it, or after five business days without observations. Extra revisions, or changes to elements that were already approved, are quoted separately.
    mode: dev
    category: Pricing & Timelines
    order: 7
    featured: false
    draft: false
  - q: What about hosting, domains and other services?
    a: "I **set up and manage** the services your project needs to run (server, domain, payment processing and similar); their monthly cost is covered by you through a payment method you provide. Payment processing is registered in **your name**, so collections go straight to your account. The initial setup of these services is included within the project phases. Once the project is fully paid, everything delivered is **yours**: files, credentials and accesses included."
    mode: dev
    category: Pricing & Timelines
    order: 8
    featured: false
    draft: false
  - q: Do you offer maintenance and support?
    a: "Yes. Once the project is in production, maintenance is available as a **monthly plan**: site availability, security updates, backups and a margin of small adjustments and fixes. For projects that handle payments or user accounts, security maintenance is a required part of the service, not an optional extra. Response times depend on the plan you choose."
    mode: dev
    category: Pricing & Timelines
    order: 9
    featured: false
    draft: false
  - q: What do you enjoy most about your work?
    a: I love the challenge of solving complex problems through design and technology. It's incredibly rewarding to see people interact with something I've created and find it genuinely useful and easy to navigate. Bridging the gap between user needs and technical possibilities is what truly excites me.
    mode: both
    category: About Me
    order: 10
    featured: false
    draft: false
  - q: What are your hobbies outside of work?
    a: "When I'm not coding, I'm usually behind a camera: shooting photography, filming, or editing video. I'm passionate about filmmaking and visual storytelling, and I love exploring Santo Domingo looking for new places and stories to capture."
    mode: both
    category: About Me
    order: 11
    featured: false
    draft: false
  - q: What do you film and photograph?
    a: Short films, event photography and vertical reels for Instagram and Shorts. I also **edit and color**, on my own footage or on material you already have.
    mode: film
    order: 100
    featured: true
    draft: false
  - q: How do I book a shoot?
    a: Use the contact form with the **Film or photo** topic and tell me the date, the place and what happens. I usually reply within 24 hours.
    mode: film
    order: 101
    featured: true
    draft: false
  - q: Where do you shoot?
    a: "I am based in **Santo Domingo, Dominican Republic**, and that is where most of my shoots happen: conferences, launches and community events."
    mode: film
    order: 102
    featured: true
    draft: false
  - q: "[How long until I get the photos?]"
    a: "[Delivery time for photos and video.]"
    draft: true
    mode: film
    order: 103
    featured: false
