entries:
  - q: ¿Qué servicios ofreces?
    a: "Ofrezco desarrollo web full-stack. En el front-end: diseño UX/UI, prototipado interactivo y sitios y aplicaciones web responsivas con Vue.js/Nuxt.js. En el back-end: APIs REST y microservicios con C#/.NET, diseño de bases de datos, contenedores con Docker y despliegues en AWS. Mi objetivo es crear experiencias digitales completas, del concepto al despliegue."
    mode: dev
    category: Servicios y proceso
    order: 1
    featured: true
    draft: false
  - q: ¿Con qué tecnologías trabajas?
    a: "**Front-end:** Vue.js, Nuxt, TypeScript y Tailwind CSS. **Back-end:** C#/.NET, bases de datos SQL, arquitectura de microservicios, Docker y AWS. Llevo casi un año construyendo sistemas back-end profesionalmente. **Más allá del código:** fotografía, cine y edición de video con Adobe Premiere Pro."
    mode: dev
    category: Servicios y proceso
    order: 2
    featured: false
    draft: false
  - q: ¿Cómo trabajas?
    a: "El proyecto se desarrolla por **fases**: entregables funcionales que se completan de forma secuencial. Al concluir cada semana presento el avance en una reunión breve, para mantener la transparencia del proceso y permitir tu retroalimentación oportuna. Una fase nueva inicia cuando la anterior está entregada, pagada y aprobada."
    mode: dev
    category: Servicios y proceso
    order: 3
    featured: true
    draft: false
  - q: ¿Qué necesitaré de ti?
    a: Para que el proyecto avance necesitaré el **contenido** (textos, imágenes, audios y videos), tus **referencias de diseño** (colores, estilo y logotipo), un **medio de pago** para cubrir el costo mensual de los servicios de operación (alojamiento, dominio y similares), y tu retroalimentación en las presentaciones semanales. El retraso en la entrega de estos elementos desplaza las fechas de entrega.
    mode: dev
    category: Servicios y proceso
    order: 4
    featured: false
    draft: false
  - q: ¿Cómo se cotiza y factura un proyecto?
    a: "El pago se realiza **por fases**: cada fase se abona de forma íntegra al inicio, y el trabajo de una fase no comienza hasta recibir su pago. Todos los montos se expresan en USD. Los montos y plazos corresponden al alcance acordado. Toda función nueva o cambio importante en los requisitos se cotiza y acuerda por separado, antes de ejecutarse."
    mode: dev
    category: Precios y plazos
    order: 5
    featured: true
    draft: false
  - q: ¿Cuánto tarda un proyecto?
    a: Los proyectos se planifican en **semanas**, con un número de horas de dedicación acordado por semana. Los plazos son estimaciones de buena fe y dependen de recibir a tiempo el contenido, los accesos y las aprobaciones; el retraso en esos elementos desplaza las fechas. Respondo consultas en un plazo de hasta tres días hábiles, y existe un plan de soporte prioritario si necesitas tiempos de respuesta menores.
    mode: dev
    category: Precios y plazos
    order: 6
    featured: true
    draft: false
  - q: ¿Cuántas revisiones incluye?
    a: Cada fase incluye hasta **dos rondas de ajustes** sobre lo acordado para esa fase. Una fase se considera aprobada cuando confirmas tu conformidad, o cuando transcurren cinco días hábiles desde su entrega sin observaciones. Las revisiones adicionales, y los cambios sobre elementos ya aprobados, se cotizan de forma independiente.
    mode: dev
    category: Precios y plazos
    order: 7
    featured: false
    draft: false
  - q: ¿Qué pasa con el alojamiento, el dominio y otros servicios?
    a: "Yo **configuro y administro** los servicios que tu proyecto necesita para operar (servidor, dominio, procesamiento de pagos y similares); su costo mensual lo cubres tú mediante un medio de pago que proporciones. El procesamiento de pagos se registra a **tu nombre**, de modo que los cobros se depositan directamente en tu cuenta. La configuración inicial de estos servicios está incluida dentro de las fases del proyecto. Liquidado el pago en su totalidad, todo lo entregado es **tuyo**: archivos, credenciales y accesos incluidos."
    mode: dev
    category: Precios y plazos
    order: 8
    featured: false
    draft: false
  - q: ¿Ofreces mantenimiento y soporte?
    a: "Sí. Una vez el proyecto entra en producción, el mantenimiento se factura como una **cuota mensual**: disponibilidad del sitio, actualizaciones de seguridad, copias de seguridad y un margen de pequeños ajustes y correcciones. En proyectos que gestionan pagos o cuentas de usuario, el mantenimiento de seguridad es un componente necesario del servicio, no una prestación opcional. Los plazos de respuesta dependen del plan contratado."
    mode: dev
    category: Precios y plazos
    order: 9
    featured: false
    draft: false
  - q: ¿Qué es lo que más disfrutas de tu trabajo?
    a: Me encanta el reto de resolver problemas complejos a través del diseño y la tecnología. Es enormemente gratificante ver a alguien interactuar con algo que construí y que le resulte genuinamente útil y fácil de usar. Tender el puente entre las necesidades de las personas y las posibilidades técnicas es lo que de verdad me emociona.
    mode: both
    category: Sobre mí
    order: 10
    featured: false
    draft: false
  - q: ¿Cuáles son tus pasatiempos fuera del trabajo?
    a: "Cuando no estoy programando, normalmente estoy detrás de una cámara: haciendo fotografía, filmando o editando video. Me apasionan el cine y la narrativa visual, y me encanta explorar Santo Domingo buscando nuevos lugares e historias que capturar."
    mode: both
    category: Sobre mí
    order: 11
    featured: false
    draft: false
  - q: ¿Qué filmas y fotografías?
    a: Cortometrajes, fotografía de eventos y reels verticales para Instagram y Shorts. También hago **edición y color**, con mi material o con el que ya tengas.
    mode: film
    order: 100
    featured: true
    draft: false
  - q: ¿Cómo reservo una sesión?
    a: Usa el formulario de contacto con el tema **Cine o foto** y cuéntame la fecha, el lugar y qué va a pasar. Suelo responder en menos de 24 horas.
    mode: film
    order: 101
    featured: true
    draft: false
  - q: ¿Dónde filmas y fotografías?
    a: "Vivo en **Santo Domingo, República Dominicana**, y ahí hago la mayoría de mis coberturas: conferencias, lanzamientos y eventos comunitarios."
    mode: film
    order: 102
    featured: true
    draft: false
  - q: "[¿Cuánto tardan las fotos?]"
    a: "[Tiempo de entrega de fotos y video.]"
    draft: true
    mode: film
    order: 103
    featured: false
