name: Deploy to gh-pages

on:
  push:
    branches:
      - master
  # The media pipeline asks for a rebuild when its manifest changes (docs/MEDIA.md, "Connection")
  repository_dispatch:
    types:
      - media-updated
  workflow_dispatch:

# A burst of uploads sends a burst of dispatches. Only the newest build matters: it pulls the
# newest manifest, so an older run still in progress is cancelled rather than queued.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.14.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Public URL, so a repository variable rather than a secret. While it is unset the committed
      # manifest is used, which is the state until the pipeline is deployed.
      - name: Pull the media manifest
        run: pnpm media:pull
        env:
          MEDIA_MANIFEST_URL: ${{ vars.MEDIA_MANIFEST_URL }}

      - name: Generate static site
        run: pnpm generate
        env:
          # Public by design (it identifies the form, not the account). Without the secret the
          # contact form falls back to opening the visitor's email app, so the build still works.
          NUXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.output/public
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: ${{ github.event.head_commit.message || 'Rebuild for a media update' }}
