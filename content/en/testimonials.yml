entries:
  - quote: Victor's vision for Filmmaking is impressive. His creativity and ability to tell stories through video exceed all expectations. The work he did for our program captured the audience's attention and emotions in a unique way. He is definitely a reference in audiovisual production.
    name: Derwin Eusebio
    role: Audiovisual Coordinator, PLERD
    mode: both
  - quote: Victor has an extraordinary eye for photography. Each image conveys feelings and manages to narrate impactful visual stories. His professional approach ensured our educational events were recorded with quality and beauty. It's a pleasure to collaborate on projects with him.
    name: Elcilia Del Carme Torres G.
    role: Educational Manager and Trainer
    mode: both
  - quote: Victor's web development allowed us to improve our team's digital presence. His solutions are functional, modern, and user-centered. The website he designed is fast and easy to use, which has facilitated communication and project management.
    name: Victor J. Garces
    role: Software Engineer
    mode: dev
